<main class="auth-page">
  <section class="auth-card">
    <p class="eyebrow">SI2 Nutricionista</p>
    <h1>Crear cuenta</h1>
    <p class="muted">El registro público crea una cuenta de paciente.</p>
    @if (error) { <p class="error" role="alert">{{ error }}</p> }
    @if (success) { <p class="success" role="status">{{ success }} Redirigiendo…</p> }
    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="row">
        <label>Nombre <input formControlName="first_name" autocomplete="given-name" /></label>
        <label>Apellido <input formControlName="last_name" autocomplete="family-name" /></label>
      </div>
      <label>Correo electrónico <input type="email" formControlName="email" autocomplete="email" /></label>
      <label>Contraseña <input type="password" formControlName="password" autocomplete="new-password" /></label>
      @if (form.controls.password.touched && form.controls.password.invalid) { <small>Usa al menos 8 caracteres.</small> }
      <button type="submit" [disabled]="loading">{{ loading ? 'Creando…' : 'Crear cuenta' }}</button>
    </form>
    <p class="muted">¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
  </section>
</main>
